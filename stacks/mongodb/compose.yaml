services:
  mongodb:
    command:
      - mongod
      - --config
      - /etc/mongod.yaml
    container_name: '${PROJECT_NAME:?must be set}-mongodb'
    depends_on:
      mongodb-permissions:
        condition: service_completed_successfully
    entrypoint: /opt/mongodb/entrypoint.sh
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    hostname: '${PROJECT_NAME:?must be set}-mongodb'
    image: 'mongodb/mongodb-community-server:9.0-ubi10-slim'
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    # ports:
    #   - '${MONGODB_EXPOSE_HOST:?must be set}:${MONGODB_EXPOSE_PORT:?must be set}:27017'
    restart: always
    stop_grace_period: 2m
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        hard: 64000
        soft: 64000
      nproc:
        hard: 64000
        soft: 64000
    volumes:
      - '${MONGODB_BACKUPS_PATH:?must be set}:/mnt/backups'
      - '${MONGODB_FILES_PATH:?must be set}:/data/db'
      - './etc/mongod.yaml:/etc/mongod.yaml:ro'
      - './etc/mongosh.yaml:/etc/mongosh.conf:ro'
      - './opt:/opt/mongodb:ro'
      - 'mongodb-config:/data/configdb'

  mongodb-init:
    command:
      - --quiet
      - --file
      - /opt/mongodb/init.js
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - 'mongodb://${PROJECT_NAME:?must be set}-mongodb:27017/?directConnection=true'
    environment:
      MONGODB_REPLICA_SET_HOST: '${PROJECT_NAME:?must be set}-mongodb:27017'
    image: 'mongodb/mongodb-community-server:9.0-ubi10-slim'
    restart: no
    volumes:
      - './etc/mongosh.yaml:/etc/mongosh.conf:ro'
      - './opt:/opt/mongodb:ro'

  mongodb-permissions:
    command:
      - -c
      - |
        mkdir -p /data/db /data/configdb /mnt/backups
        chown -R 1000:1000 /data/db /data/configdb /mnt/backups
        chmod -R u+rwX /data/db /data/configdb /mnt/backups
        chmod 750 /data/db /data/configdb /mnt/backups
    entrypoint:
      - /bin/sh
      - -eu
    image: alpine:latest
    network_mode: none
    restart: no
    user: root
    volumes:
      - '${MONGODB_BACKUPS_PATH:?must be set}:/mnt/backups'
      - '${MONGODB_FILES_PATH:?must be set}:/data/db'
      - 'mongodb-config:/data/configdb'

volumes:
  mongodb-config:
