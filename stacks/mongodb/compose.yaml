services:
  mongodb:
    command:
      - mongod
      - --bind_ip_all
      # - --keyFile
      # - /data/configdb/keyfile
      - --replSet
      - rs0
    container_name: '${PROJECT_NAME:?must be set}-mongodb'
    entrypoint: /opt/mongodb/entrypoint.sh
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    hostname: '${PROJECT_NAME:?must be set}-mongodb'
    image: 'mongodb/mongodb-community-server:8.3-ubuntu2204-slim'
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    # ports:
    #   - '${MONGODB_EXPOSE_HOST:?must be set}:${MONGODB_EXPOSE_PORT:?must be set}:27017'
    restart: always
    stop_grace_period: 2m
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        hard: 64000
        soft: 64000
      nproc:
        hard: 64000
        soft: 64000
    volumes:
      - '${MONGODB_BACKUPS_PATH:?must be set}:/mnt/backups'
      - '${MONGODB_FILES_PATH:?must be set}:/data/db'
      - './opt:/opt/mongodb:ro'
      - 'mongodb-config:/data/configdb'

volumes:
  mongodb-config:
