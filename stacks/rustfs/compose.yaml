# Shared with the main stack's gateway, which serves the public bucket, so the gateway stays off the default network with the databases.
networks:
  file-storage:

secrets:
  RUSTFS_ACCESS_KEY:
    environment: RUSTFS_ACCESS_KEY
  RUSTFS_SECRET_KEY:
    environment: RUSTFS_SECRET_KEY

services:
  rustfs:
    container_name: '${PROJECT_NAME:?must be set}-rustfs'
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/RUSTFS_ACCESS_KEY
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CHECK_UPDATE: 'false'
      RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_SECRET_KEY_FILE: /run/secrets/RUSTFS_SECRET_KEY
      RUSTFS_VOLUMES: /data
    healthcheck:
      interval: 30s
      retries: 3
      start_interval: 1s
      start_period: 40s
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/health
      timeout: 10s
    image: 'rustfs/rustfs:1.0.6'
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    networks:
      - default
      - file-storage
    ports:
      - '${RUSTFS_EXPOSE_HOST:?must be set}:${RUSTFS_API_EXPOSE_PORT:?must be set}:9000'
      - '${RUSTFS_EXPOSE_HOST:?must be set}:${RUSTFS_CONSOLE_EXPOSE_PORT:?must be set}:9001'
    restart: always
    secrets:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
      - '${RUSTFS_FILES_PATH:?must be set}:/data'

  rustfs-init:
    container_name: '${PROJECT_NAME:?must be set}-rustfs-init'
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /opt/rustfs/init.sh
    environment:
      # rc keeps no config: the alias comes from the environment.
      HOME: /tmp
      PROJECT_NAME: '${PROJECT_NAME:?must be set}'
      RUSTFS_HOST: 'rustfs:9000'
      RUSTFS_INIT_ENVIRONMENTS: '${RUSTFS_INIT_ENVIRONMENTS:?must be set}'
    image: 'rustfs/rc:v0.1.38'
    restart: no
    secrets:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
    user: '10001:10001'
    volumes:
      - '${RUSTFS_INIT_OUTPUT_PATH:?must be set}:/output'
      - './opt:/opt/rustfs:ro'

  rustfs-permissions:
    command:
      - -c
      - |
        chown -R 10001:10001 /data /output
        chmod 700 /output
    entrypoint:
      - /bin/sh
      - -eu
    image: 'alpine:latest'
    restart: no
    user: root
    volumes:
      - '${RUSTFS_FILES_PATH:?must be set}:/data'
      - '${RUSTFS_INIT_OUTPUT_PATH:?must be set}:/output'
