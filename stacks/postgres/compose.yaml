secrets:
  POSTGRES_PASSWORD:
    environment: POSTGRES_PASSWORD

services:
  postgres:
    container_name: '${PROJECT_NAME:?must be set}-postgres'
    environment:
      POSTGRES_DB: '${POSTGRES_DATABASE:?must be set}'
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_USER: '${POSTGRES_USER:?must be set}'
      TZ: UTC
    image: 'postgres:18'
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    # ports:
    #   - '${POSTGRES_EXPOSE_HOST:?must be set}:${POSTGRES_EXPOSE_PORT:?must be set}:5432'
    restart: always
    secrets:
      - POSTGRES_PASSWORD
    shm_size: 256m
    stop_grace_period: 1m
    volumes:
      - '${POSTGRES_BACKUPS_PATH:?must be set}:/mnt/backups'
      - '${POSTGRES_FILES_PATH:?must be set}:/var/lib/postgresql'
